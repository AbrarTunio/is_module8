<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Access Control – Activity Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* This page is intentionally always light (white and soft pink), even when the viewer or device prefers dark mode. */
:root{
  color-scheme:light;
  --bg:#fffafc; --surface:#ffffff; --surface-2:#fdf2f6; --border:#f4dbe5; --border-strong:#e9bfd0; --text:#3f1d2e; --muted:#80566a;
  --primary:#c93a72; --primary-dark:#a32a5b; --primary-soft:#fce8f0; --primary-ink:#ffffff; --accent:#f3aeca;
  --good:#23714a; --good-soft:#e7f6ed; --good-border:#9fd6b6; --bad:#b4231b; --bad-soft:#fff0ee; --bad-border:#f0b0aa;
  --warn:#86590a; --warn-soft:#fff8e3; --warn-border:#efd99a; --topbar:rgba(255,255,255,.92);
  --shadow:0 1px 2px rgba(63,29,46,.05),0 12px 28px rgba(201,58,114,.07); --btn-shadow:0 6px 16px rgba(201,58,114,.22); --code-bg:#fdf5f8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:light;
    --bg:#fffafc; --surface:#ffffff; --surface-2:#fdf2f6; --border:#f4dbe5; --border-strong:#e9bfd0; --text:#3f1d2e; --muted:#80566a;
    --primary:#c93a72; --primary-dark:#a32a5b; --primary-soft:#fce8f0; --primary-ink:#ffffff; --accent:#f3aeca;
    --good:#23714a; --good-soft:#e7f6ed; --good-border:#9fd6b6; --bad:#b4231b; --bad-soft:#fff0ee; --bad-border:#f0b0aa;
    --warn:#86590a; --warn-soft:#fff8e3; --warn-border:#efd99a; --topbar:rgba(255,255,255,.92);
    --shadow:0 1px 2px rgba(63,29,46,.05),0 12px 28px rgba(201,58,114,.07); --btn-shadow:0 6px 16px rgba(201,58,114,.22); --code-bg:#fdf5f8;
  }
}
:root[data-theme="dark"]{
  color-scheme:light;
  --bg:#fffafc; --surface:#ffffff; --surface-2:#fdf2f6; --border:#f4dbe5; --border-strong:#e9bfd0; --text:#3f1d2e; --muted:#80566a;
  --primary:#c93a72; --primary-dark:#a32a5b; --primary-soft:#fce8f0; --primary-ink:#ffffff; --accent:#f3aeca;
  --good:#23714a; --good-soft:#e7f6ed; --good-border:#9fd6b6; --bad:#b4231b; --bad-soft:#fff0ee; --bad-border:#f0b0aa;
  --warn:#86590a; --warn-soft:#fff8e3; --warn-border:#efd99a; --topbar:rgba(255,255,255,.92);
  --shadow:0 1px 2px rgba(63,29,46,.05),0 12px 28px rgba(201,58,114,.07); --btn-shadow:0 6px 16px rgba(201,58,114,.22); --code-bg:#fdf5f8;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);background:#fffafc}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  background-image:radial-gradient(900px 420px at 0% -8%,var(--primary-soft),transparent 65%),radial-gradient(700px 360px at 100% 0%,var(--surface-2),transparent 60%);background-repeat:no-repeat;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--topbar);backdrop-filter:blur(10px)}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:"Lexend","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em;color:var(--text);font-weight:700}
h1{font-size:clamp(2rem,5.2vw,3.2rem)}
h2{font-size:clamp(1.35rem,3.1vw,1.8rem)}
h3{font-size:1.18rem}
h4{font-size:1.02rem}
p{margin:0 0 .8em}
b,strong{font-weight:700}
.mono,code{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
code{font-size:.86em;background:var(--code-bg);border:1px solid var(--border);padding:.05em .4em;border-radius:6px}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.wrap{max-width:920px;margin:0 auto;padding:26px 20px 70px}
.small{font-size:.9rem}.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}.center{justify-content:center}
.stack>*+*{margin-top:18px}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--topbar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:920px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--text);text-align:left}
.brand:disabled{cursor:default}
.brand-ic{width:36px;height:36px;border-radius:11px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:18px;flex:none}
.brand-t{font-family:"Lexend",sans-serif;font-weight:700;font-size:1.02rem;line-height:1.1}
.brand-t small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;font-size:.8rem;color:var(--muted)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tb-prog{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-weight:700}
.tb-prog .progress{width:90px}
.student{display:flex;align-items:center;gap:8px;font-size:.88rem;line-height:1.2}
.student small{display:block;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);display:grid;place-items:center;font-weight:700;border:1.5px solid var(--accent)}

/* Basics */
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:clamp(18px,3.6vw,32px)}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);padding:5px 12px;border-radius:999px}
.lead{font-size:1.12rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--primary-dark)}
.pill.warn{background:var(--warn-soft);border-color:var(--warn-border);color:var(--warn)}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:99px;transition:width .45s ease}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 20px;font-size:1rem;font-weight:700;cursor:pointer;background:var(--primary);color:var(--primary-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .2s;box-shadow:var(--btn-shadow)}
.btn:hover{background:var(--primary-dark)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:transparent;color:var(--primary-dark);border:1.5px solid var(--border-strong);box-shadow:none}
.btn-ghost:hover{background:var(--primary-soft)}
.btn-soft{background:var(--primary-soft);color:var(--primary-dark);box-shadow:none;border:1px solid var(--border)}
.btn-soft:hover{background:var(--surface-2);border-color:var(--primary)}
.btn-skip{background:var(--surface-2);color:var(--muted);box-shadow:none;border:1px solid var(--border)}
.btn-skip:hover{background:var(--primary-soft);color:var(--primary-dark)}
.btn-sm{padding:8px 14px;font-size:.92rem;border-radius:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.95rem}
.input{font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);outline:none;transition:border .2s,box-shadow .2s;width:100%}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.err{color:var(--bad);font-size:.92rem;font-weight:700;min-height:1.3em;margin-top:6px}

/* Welcome */
.hero-grid{display:grid;grid-template-columns:1.2fr .95fr;gap:24px;align-items:center}
.hero-facts{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero-facts li{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:.95rem}
.gate{display:flex;flex-direction:column;gap:10px}
.gate-h{text-align:center;font-family:"Lexend",sans-serif;font-weight:700;color:var(--primary-dark);font-size:.95rem}
.ticket{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--surface);border:1.5px dashed var(--border-strong);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.ticket:nth-child(2){transform:rotate(-1.5deg)}.ticket:nth-child(4){transform:rotate(1.2deg)}
.ticket .who{font-weight:700}
.ticket .what{font-size:.86rem;color:var(--muted)}
.stamp{font-family:"Lexend",sans-serif;font-weight:700;font-size:.82rem;padding:4px 10px;border-radius:8px;border:2px solid;transform:rotate(-6deg)}
.stamp.allow{color:var(--good);border-color:var(--good)}
.stamp.deny{color:var(--bad);border-color:var(--bad)}
.who-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}

/* Overview */
.objectives{margin:0;padding-left:1.3em;display:grid;gap:6px}
.objectives li::marker{color:var(--primary);font-weight:700}
.journey{display:grid;gap:12px}
.jcard{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;border:1.5px solid var(--border);border-radius:16px;padding:16px;background:var(--surface)}
.jcard.locked{opacity:.65}
.jcard.quiz{border-color:var(--accent);background:var(--surface-2)}
.jnum{width:46px;height:46px;border-radius:14px;background:var(--primary-soft);color:var(--primary-dark);display:grid;place-items:center;font-family:"Lexend",sans-serif;font-weight:700;font-size:1.25rem;border:1.5px solid var(--accent)}
.jtitle{font-weight:700;font-size:1.05rem}
.jmeta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.marks{width:100%;border-collapse:collapse;font-size:.96rem}
.marks th,.marks td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.marks tr:last-child td,.marks tr:last-child th{border-bottom:0}
.marks th{background:var(--surface-2);font-weight:700}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.howto div{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px}
.howto .ic{font-size:1.5rem;display:block}

/* Step */
.crumbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.95rem;margin-bottom:10px}
.step-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-tag{display:inline-flex;align-items:center;gap:8px;font-family:"Lexend",sans-serif;font-weight:700;font-size:1.04rem;margin-bottom:12px;color:var(--primary-dark)}
.key{background:var(--primary-soft);border-left:5px solid var(--primary);padding:14px 16px;border-radius:12px;margin-top:14px}
.analogy{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:12px;padding:12px 14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.mini{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px}
.mini-h{font-family:"Lexend",sans-serif;font-weight:700;margin-bottom:4px;color:var(--primary-dark)}
.activity{border:2px solid var(--accent);background:linear-gradient(180deg,var(--surface-2),var(--surface) 160px)}
.act-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.done-badge{display:none;align-items:center;gap:6px;background:var(--good);color:#fff;font-weight:700;font-size:.88rem;padding:4px 12px;border-radius:999px}
.activity.is-done .done-badge{display:inline-flex}
.task-text{font-weight:700;font-size:1.02rem}
.hint-area{margin-top:16px;border-top:1px dashed var(--border-strong);padding-top:14px}
.hint-btn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border);box-shadow:none}
.hint-btn:hover{background:var(--warn-soft);border-color:var(--warn)}
.hintbox{background:var(--warn-soft);border:1px solid var(--warn-border);padding:10px 14px;border-radius:12px;margin-top:10px;animation:pop .25s}
.feedback{padding:12px 14px;border-radius:12px;margin-top:12px;border-left:5px solid var(--border-strong);background:var(--surface-2);animation:pop .25s}
.feedback.good{background:var(--good-soft);border-left-color:var(--good)}
.feedback.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.fb-actions{margin-top:10px}
.stepnav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:10px;height:10px;border-radius:99px;background:var(--border-strong);transition:.3s}
.dots i.ok{background:var(--accent)}
.dots i.on{width:28px;background:var(--primary)}
.part{margin:20px 0 8px;color:var(--primary-dark)}
.part:first-child{margin-top:0}
.flowline{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:12px 0}
.flowline .fbox{flex:1 1 130px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:10px 12px;text-align:center}
.flowline .fbox b{display:block;font-family:"Lexend",sans-serif}
.flowline .fbox.hi{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.flowline .arr{align-self:center;color:var(--primary);font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
.role{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:.93rem}
.role b{display:block;color:var(--primary-dark)}

/* Choice quiz */
.cq-top{display:flex;align-items:center;gap:12px}
.cq-bar{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.cq-bar i{display:block;height:100%;background:var(--primary);transition:width .3s}
.cq-q{font-size:1.06rem;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:12px}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.opt{font-size:1rem;font-weight:700;padding:12px 16px;border-radius:12px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s;text-align:left;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.attrs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.attr{font-size:.86rem;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:3px 9px}
.attr b{color:var(--primary-dark)}
.lvl{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid var(--border-strong);background:var(--surface)}

/* Flip */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.flip{perspective:900px;height:236px;cursor:pointer;border:0;background:none;padding:0;color:inherit;text-align:left}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:16px;border:2px solid var(--border-strong);display:flex;flex-direction:column}
.front{background:var(--surface);align-items:center;justify-content:center;text-align:center;gap:2px}
.flip:hover .front{border-color:var(--primary)}
.back{background:var(--primary-soft);border-color:var(--accent);transform:rotateY(180deg);font-size:.92rem;overflow:auto;gap:6px}
.big-emoji{font-size:44px;line-height:1.1}
.f-big{font-family:"Lexend",sans-serif;font-weight:700;font-size:1.7rem;color:var(--primary-dark)}
.f-type{font-weight:700;color:var(--primary-dark)}
.weak{margin-top:auto;background:var(--surface);border-radius:10px;padding:6px 8px;font-size:.86rem}

/* Sort */
.sub{font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;border-radius:14px;background:var(--surface);border:1.5px dashed var(--border-strong)}
.chip{font-size:.95rem;font-weight:700;padding:8px 14px;border-radius:999px;border:1.5px solid var(--border-strong);background:var(--surface-2);color:var(--text);cursor:pointer;transition:transform .15s,background .15s;text-align:left}
.chip:hover{border-color:var(--primary)}
.chip.sel{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--btn-shadow)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}
.bucket{text-align:left;cursor:pointer;border-radius:14px;border:2px solid var(--border-strong);background:var(--surface);padding:12px;min-height:130px;color:var(--text);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s}
.bucket:hover{border-color:var(--primary);background:var(--surface-2)}
.bh{font-family:"Lexend",sans-serif;font-weight:700;font-size:1rem}
.placedlist{display:flex;flex-wrap:wrap;gap:5px}
.placed{font-size:.82rem;background:var(--good-soft);border:1px solid var(--good-border);border-radius:8px;padding:2px 8px;color:var(--good);font-weight:700}

/* Ordering */
.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.events{display:grid;gap:8px}
.event{width:100%;font-weight:400}
.timeline{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.tl-empty{border:1.5px dashed var(--border-strong);border-radius:12px;padding:14px;color:var(--muted);text-align:center}
.tl-item{display:flex;gap:12px;align-items:flex-start;background:var(--good-soft);border:1px solid var(--good-border);border-radius:12px;padding:10px 12px;animation:pop .3s}
.tl-num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:700}
.tl-phase{font-size:.84rem;font-weight:700;color:var(--primary-dark)}

/* Matrix */
table.matrix{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem}
table.matrix th,table.matrix td{padding:9px 10px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:center;white-space:nowrap}
table.matrix th{background:var(--surface-2)}
table.matrix td{font-family:"JetBrains Mono",monospace;font-size:.84rem}
table.matrix td.empty{color:var(--border-strong)}
table.matrix .hdr{font:inherit;font-weight:700;background:var(--surface);border:1.5px solid var(--border-strong);border-radius:8px;padding:5px 9px;cursor:pointer;color:var(--text)}
table.matrix .hdr:hover{border-color:var(--primary);background:var(--primary-soft)}
table.matrix .hl{background:var(--primary-soft)}
.listout{background:var(--code-bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:10px;min-height:52px}
.tasks{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.task{display:flex;gap:10px;align-items:center;font-weight:700;color:var(--muted)}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;font-size:.8rem;flex:none;color:transparent;transition:.25s}
.task.ok{color:var(--good)}
.task.ok .tick{background:var(--good);border-color:var(--good);color:#fff}

/* Permission builder */
.perm{display:grid;grid-template-columns:auto repeat(3,1fr);gap:8px;align-items:center;max-width:520px}
.perm .ph{font-weight:700;text-align:center;font-size:.9rem}
.perm .rh{font-weight:700}
.pbtn{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:1.05rem;padding:10px;border-radius:12px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--muted);cursor:pointer;transition:.15s}
.pbtn[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.permout{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.permout .stat{flex:1 1 160px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.stat .k{font-size:.84rem;color:var(--muted);font-weight:700}
.stat .v{font-weight:700;font-size:1.15rem}
.mission{background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:12px 14px;margin-bottom:14px}

/* Ladder */
.ladder{display:flex;flex-direction:column;gap:6px;max-width:420px;margin:12px 0}
.rung{display:flex;justify-content:space-between;align-items:center;border-radius:10px;padding:8px 12px;font-weight:700;border:1px solid var(--border)}
.rung:nth-child(1){background:#f9d3e2}.rung:nth-child(2){background:#fbe0ea}.rung:nth-child(3){background:#fdecf2}.rung:nth-child(4){background:#fff7fa}

/* Review */
.review-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;background:var(--surface)}
.review-row.right{border-color:var(--good-border);background:var(--good-soft)}
.review-row.wrong{border-color:var(--bad-border);background:var(--bad-soft)}
.review-row .why{grid-column:1/-1;font-size:.92rem}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px}
.seg button{font-size:.92rem;font-weight:700;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:9px;cursor:pointer}
.seg button.on.keep{background:var(--good);color:#fff}
.seg button.on.rev{background:var(--bad);color:#fff}
.reviews{display:flex;flex-direction:column;gap:8px}

/* Sequence */
.seq{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.msg{display:flex;flex-direction:column;gap:3px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--border);animation:slide .35s}
.msg .dir{font-size:.86rem;font-weight:700;color:var(--muted)}
.msg .pay{font-size:.98rem}
.msg .note{font-size:.9rem;color:var(--muted)}
.msg.l{margin-right:16%}.msg.r{margin-left:16%}
.msg.c{margin:0 8%;background:var(--surface-2);border-style:dashed}
.msg.ok{background:var(--good-soft);border-color:var(--good-border)}
.actors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-weight:700}
.actors div{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:8px;font-size:.92rem}

/* Done, quiz, result */
.done-card{text-align:center}
.medal{font-size:64px;line-height:1}
.takeaways{text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:16px 20px;margin:18px auto;max-width:640px}
.takeaways ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.qprompt{font-size:1.22rem;margin:14px 0}
.qopts{display:flex;flex-direction:column;gap:10px}
.qopt{display:flex;gap:12px;align-items:center;text-align:left;font-size:1rem;padding:12px 14px;border-radius:14px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s}
.qopt:hover:not(:disabled){border-color:var(--primary);background:var(--surface-2)}
.qopt:disabled{cursor:default}
.letter{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;flex:none;border:1px solid var(--border)}
.qopt.sel{border-color:var(--primary);background:var(--primary-soft)}
.qopt.sel .letter{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.qopt.right{border-color:var(--good);background:var(--good-soft)}
.qopt.right .letter{background:var(--good);color:#fff}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qopt.wrong .letter{background:var(--bad);color:#fff}
.cert{border:2px solid var(--accent)}
.result-grid{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin-top:12px}
.ring{width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p) * 1%),var(--surface-2) 0);display:grid;place-items:center;border:1px solid var(--border)}
.ring>div{width:132px;height:132px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-family:"Lexend",sans-serif;font-size:2.7rem;color:var(--primary-dark)}
.ring span{display:block;color:var(--muted);font-size:1rem;margin-top:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kv div{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:8px 12px}
.kv small{display:block;color:var(--muted);font-size:.84rem}
.kv b{font-size:1.02rem;word-break:break-word}
.status-pass{color:var(--good)}.status-fail{color:var(--bad)}
.review{margin:0;padding-left:1.3em;display:grid;gap:12px}
.review li{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.review .yes{color:var(--good);font-weight:700}.review .no{color:var(--bad);font-weight:700}
textarea.copybox{width:100%;min-height:150px;font-family:"JetBrains Mono",monospace;font-size:.85rem;border-radius:12px;border:1.5px solid var(--border-strong);padding:10px;background:var(--surface);color:var(--text);margin-top:10px}
.foot{text-align:center;color:var(--muted);font-size:.86rem;padding:0 20px 30px}

@keyframes pop{from{transform:scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .4s}
.screen{animation:slide .35s ease}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(106vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:760px){
  .hero-grid,.who-grid,.order-grid,.two-col,.result-grid{grid-template-columns:1fr}
  .hero-facts{grid-template-columns:1fr}
  .jcard{grid-template-columns:auto 1fr}
  .jcard .btn{grid-column:1/-1}
  .msg.l{margin-right:4%}.msg.r{margin-left:4%}.msg.c{margin:0 2%}
  .ring{margin:0 auto}
  .tb-prog{display:none}
  .review-row{grid-template-columns:1fr}
}

<body>
<header class="topbar" id="topbar"></header>
<main id="app" class="wrap"></main>
<footer class="foot">Progress is saved in this browser only. On a shared lab computer, choose “I’m a different student” before starting.</footer>

<script>
(function(){
"use strict";
/* Keep the page light even if the viewer switches to dark mode */
const rootEl = document.documentElement;
function forceLight(){ if(rootEl.getAttribute("data-theme") !== "light") rootEl.setAttribute("data-theme","light"); }
forceLight();
try{ new MutationObserver(forceLight).observe(rootEl, {attributes:true, attributeFilter:["data-theme"]}); }catch(e){}

const KEY = "ac-activity-lab-v1";
const TOTAL = 15;
const app = document.getElementById("app");
const topbar = document.getElementById("topbar");
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function fresh(){ return { name:"", roll:"", maxPos:-1, done:{}, results:[] }; }
let S = fresh();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const v = localStorage.getItem(KEY); if(v){ const o = JSON.parse(v); if(o && typeof o === "object") S = Object.assign(fresh(), o); } }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shake(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function doneCount(){ return Object.keys(S.done).filter(k => S.done[k]).length; }
let mode = "welcome";

function confetti(){
  if(reduceMotion) return;
  const cols = ["#c93a72","#f3aeca","#f7c86b","#9fd6b6","#b98ad9"];
  const box = document.createElement("div"); box.className = "confetti";
  for(let i=0;i<70;i++){ const p = document.createElement("i"); p.style.left = (Math.random()*100)+"vw"; p.style.background = cols[i%cols.length]; p.style.animationDelay = (Math.random()*.7)+"s"; p.style.animationDuration = (2+Math.random()*1.6)+"s"; box.appendChild(p); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4500);
}

/* ---------- Generic activity builders ---------- */
function choiceQuiz(root, cfg){
  const items = cfg.items; let i = 0, first = 0, missed = false;
  const wrap = document.createElement("div"); root.appendChild(wrap);
  function show(){
    if(i >= items.length){
      wrap.innerHTML = `<div class="feedback good">🎉 All ${items.length} done! Correct on the first try: <b>${first} of ${items.length}</b></div>`;
      if(cfg.onDone) cfg.onDone(); return;
    }
    const it = items[i]; missed = false;
    let opts = (it.opts || cfg.options).slice(); if(cfg.shuffle) opts = shuffle(opts);
    wrap.innerHTML = `<div class="cq-top"><span class="pill">${i+1} of ${items.length}</span><span class="cq-bar"><i style="width:${i/items.length*100}%"></i></span></div>
      <div class="cq-q">${it.q}</div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>
      <div class="cq-fb" aria-live="polite"></div>`;
    const fb = wrap.querySelector(".cq-fb");
    wrap.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const o = opts[+b.dataset.k];
      if(o === it.a){
        if(!missed) first++;
        wrap.querySelectorAll(".opt").forEach(x => x.disabled = true);
        b.classList.add("right");
        fb.innerHTML = `<div class="feedback good"><b>Correct!</b> ${it.why}<div class="fb-actions"><button class="btn btn-sm">${i+1 < items.length ? "Next one" : "Finish"}</button></div></div>`;
        fb.querySelector("button").addEventListener("click", () => { i++; show(); });
      } else {
        missed = true; b.classList.add("wrong"); b.disabled = true; shake(b);
        fb.innerHTML = `<div class="feedback bad"><b>Not quite.</b> ${it.hint || cfg.hint || "Read it again and try another option."}</div>`;
      }
    }));
  }
  show();
}

function sortGame(root, cfg, onDone){
  const items = shuffle(cfg.items); let sel = null, placed = 0, first = 0; const missed = new Set();
  root.innerHTML = `<div class="sub">Items to sort <span class="pill" data-left>${items.length} left</span></div>
    <div class="pool" data-pool></div>
    <div class="buckets">${cfg.buckets.map(b=>`<button class="bucket" data-f="${b.id}"><span class="bh">${b.e} ${b.label}</span><span class="small muted">${b.sub}</span><div class="placedlist"></div></button>`).join("")}</div>
    <div data-fb aria-live="polite"></div>`;
  const pool = root.querySelector("[data-pool]"), fb = root.querySelector("[data-fb]"), left = root.querySelector("[data-left]");
  const nameOf = id => cfg.buckets.find(b=>b.id===id).label;
  items.forEach(it => {
    const c = el(`<button class="chip">${it.t}</button>`); c._it = it;
    c.addEventListener("click", () => {
      pool.querySelectorAll(".chip").forEach(x => x.classList.remove("sel")); c.classList.add("sel"); sel = c;
      fb.innerHTML = `<div class="feedback">Selected <b>${it.t}</b>. Now tap the box it belongs to.</div>`;
    });
    pool.appendChild(c);
  });
  root.querySelectorAll(".bucket").forEach(b => b.addEventListener("click", () => {
    if(!sel){ shake(b); fb.innerHTML = `<div class="feedback">First tap an item in the dashed box, then tap a box.</div>`; return; }
    const it = sel._it;
    if(it.f === b.dataset.f){
      if(!missed.has(it.t)) first++;
      b.querySelector(".placedlist").appendChild(el(`<span class="placed">${it.t}</span>`));
      sel.remove(); sel = null; placed++; left.textContent = (items.length-placed) + " left";
      if(placed === items.length){
        pool.innerHTML = `<span class="muted">All sorted!</span>`;
        fb.innerHTML = `<div class="feedback good">🎉 All ${items.length} sorted! Correct on the first try: <b>${first} of ${items.length}</b>.</div>`;
        onDone();
      } else fb.innerHTML = `<div class="feedback good">✓ <b>${it.t}</b> belongs in <b>${nameOf(it.f)}</b>.${it.why ? " " + it.why : ""}</div>`;
    } else {
      missed.add(it.t); shake(b);
      fb.innerHTML = `<div class="feedback bad">Not “${nameOf(b.dataset.f)}”. Hint: ${cfg.tips[it.f]}</div>`;
    }
  }));
}

function orderGame(root, events, doneMsg, onDone){
  let next = 0; const order = shuffle(events.map((e,i)=>i));
  root.innerHTML = `<div class="order-grid">
    <div><div class="sub">Steps (shuffled)</div><div class="events" data-evs></div></div>
    <div><div class="sub">Your timeline</div><ol class="timeline" data-tl><li class="tl-empty">Click the step that happens first</li></ol></div>
  </div><div data-fb aria-live="polite"></div>`;
  const evs = root.querySelector("[data-evs]"), tl = root.querySelector("[data-tl]"), fb = root.querySelector("[data-fb]");
  order.forEach(i => {
    const b = el(`<button class="opt event">${events[i].t}</button>`);
    b.addEventListener("click", () => {
      if(i === next){
        b.remove(); if(next === 0) tl.innerHTML = "";
        tl.appendChild(el(`<li class="tl-item"><span class="tl-num">${next+1}</span><div><div class="tl-phase">${events[i].phase}</div>${events[i].t}</div></li>`));
        next++;
        if(next === events.length){ fb.innerHTML = `<div class="feedback good">${doneMsg}</div>`; onDone(); }
        else fb.innerHTML = `<div class="feedback good">✓ Correct. What comes next?</div>`;
      } else { shake(b); fb.innerHTML = `<div class="feedback bad">Not yet. Hint: ${events[next].clue}</div>`; }
    });
    evs.appendChild(b);
  });
}

function flipGame(root, cards, doneMsg, onDone){
  const seen = new Set();
  root.innerHTML = `<div class="flips">${cards.map((f,i)=>`
    <button class="flip" data-i="${i}" aria-label="Flip the card: ${f.name}">
      <div class="flip-in">
        <div class="face front"><div class="big-emoji">${f.e}</div><div class="f-big">${f.k}</div><div class="muted">${f.name}</div><div class="small muted">Tap to flip</div></div>
        <div class="face back"><span class="f-type">${f.e} ${f.name}</span>${f.back}</div>
      </div></button>`).join("")}</div><div data-fb aria-live="polite"></div>`;
  const fb = root.querySelector("[data-fb]");
  root.querySelectorAll(".flip").forEach(b => b.addEventListener("click", () => {
    b.classList.toggle("on"); seen.add(b.dataset.i);
    if(seen.size === cards.length){ if(!root._flipDone){ root._flipDone = true; fb.innerHTML = `<div class="feedback good">${doneMsg}</div>`; onDone(); } }
    else fb.innerHTML = `<div class="feedback">${seen.size} of ${cards.length} cards flipped.</div>`;
  }));
}

/* ---------- Shared access matrix ---------- */
const SUBJ = ["Ali (student)","Sara (student)","Dr. Noor (teacher)","Backup process"];
const OBJ = ["marks.xlsx","notes.pdf","ali_assignment.docx","grader.exe"];
const MAT = [
  ["", "Read", "Own, Read, Write", ""],
  ["", "Read", "", ""],
  ["Read, Write", "Own, Read, Write", "Read", "Execute"],
  ["Read", "Read", "Read", ""]
];
function matrixHTML(clickable){
  const h = (t, attr) => clickable ? `<button class="hdr" ${attr}>${t}</button>` : `<b>${t}</b>`;
  return `<div class="tablewrap"><table class="matrix"><thead><tr><th>Subject ↓ / Object →</th>${OBJ.map((o,j)=>`<th data-col="${j}">${h(o,`data-c="${j}"`)}</th>`).join("")}</tr></thead>
    <tbody>${SUBJ.map((s,i)=>`<tr><th data-row="${i}">${h(s,`data-r="${i}"`)}</th>${MAT[i].map((v,j)=>`<td data-cell="${i}-${j}" class="${v?"":"empty"}">${v||"—"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

/* ---------- Activities: Lesson 1 ---------- */
function act_aaa(root, api){
  const AN = "Authentication", AC = "Access control decision", AZ = "Authorization (granting rights)", AU = "Auditing";
  choiceQuiz(root, {
    options:[AN, AZ, AC, AU],
    hint:"Ask: is the system checking <b>who</b> you are, <b>setting up</b> what you may do, <b>checking</b> a request right now, or <b>recording</b> what happened?",
    items:[
      {q:"The portal checks Sana’s password and the OTP sent to her phone.", a:AN, why:"Proving who Sana is happens <b>before</b> access control."},
      {q:"The security administrator adds a rule to the authorization database: teachers may edit marks.", a:AZ, why:"Granting rights is authorization. The rules are stored for later decisions."},
      {q:"Ali clicks Delete on a file, and the system checks his rights before letting it happen.", a:AC, why:"This is the access control function deciding one request in real time."},
      {q:"The system writes a log entry: “Ali opened marks.xlsx at 10:42 pm”.", a:AU, why:"Recording who did what, and when, is auditing."},
      {q:"You scan your fingerprint at the office door.", a:AN, why:"Your fingerprint proves who you are. What you may do inside is a separate question."},
      {q:"The security team reads last week’s logs and spots someone trying to open the exam folder 40 times.", a:AU, why:"Reviewing records to spot misuse is auditing."}
    ],
    onDone: api.complete
  });
}

function act_soar(root, api){
  sortGame(root, {
    buckets:[
      {id:"s", e:"🙋", label:"Subject", sub:"the one asking for access"},
      {id:"o", e:"📁", label:"Object", sub:"the thing being protected"},
      {id:"r", e:"🔑", label:"Access right", sub:"what may be done"}
    ],
    tips:{ s:"This is an active user, group or program that asks to do something.", o:"This is a resource that gets used, so it needs protecting.", r:"This is an action: a way a subject may use an object." },
    items:[
      {t:"Student Ali", f:"s"}, {t:"Teacher’s user account", f:"s"}, {t:"A running backup program", f:"s", why:"Programs (processes) act on behalf of users, so they are subjects too."}, {t:"The group “all teachers”", f:"s"},
      {t:"marks.xlsx", f:"o"}, {t:"Department printer", f:"o"}, {t:"Student records database table", f:"o"}, {t:"A shared folder", f:"o"},
      {t:"Read", f:"r"}, {t:"Write", f:"r"}, {t:"Execute", f:"r"}, {t:"Delete", f:"r"}
    ]
  }, api.complete);
}

function act_matrix(root, api){
  let sawAcl = false, sawCap = false, qDone = false;
  root.innerHTML = `<p class="small muted">Tap an <b>object name</b> (column) to see its ACL, or a <b>subject name</b> (row) to see its capability list.</p>
    ${matrixHTML(true)}
    <div class="listout" id="lo" aria-live="polite">Nothing selected yet.</div>
    <div class="tasks">
      <div class="task" id="ta"><span class="tick">✓</span>Open one access control list (a column)</div>
      <div class="task" id="tc"><span class="tick">✓</span>Open one capability list (a row)</div>
    </div>
    <h4 class="part">Read the matrix</h4><div id="mq"></div>`;
  const lo = root.querySelector("#lo");
  function clearHl(){ root.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")); }
  function chk(){ if(sawAcl && sawCap && qDone) api.complete(); }
  root.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => {
    const j = +b.dataset.c; clearHl();
    root.querySelectorAll(`[data-cell$="-${j}"]`).forEach(x => x.classList.add("hl"));
    const list = SUBJ.map((s,i)=>MAT[i][j] ? `<b>${s}</b>: ${MAT[i][j]}` : null).filter(Boolean);
    lo.innerHTML = `📋 <b>ACL for ${OBJ[j]}</b> (stored with the object): ${list.join(" · ") || "nobody"}`;
    sawAcl = true; root.querySelector("#ta").classList.add("ok"); chk();
  }));
  root.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.r; clearHl();
    root.querySelectorAll(`[data-cell^="${i}-"]`).forEach(x => x.classList.add("hl"));
    const list = OBJ.map((o,j)=>MAT[i][j] ? `<b>${o}</b>: ${MAT[i][j]}` : null).filter(Boolean);
    lo.innerHTML = `🎟️ <b>Capability list for ${SUBJ[i]}</b> (carried by the subject): ${list.join(" · ") || "nothing"}`;
    sawCap = true; root.querySelector("#tc").classList.add("ok"); chk();
  }));
  const Y = "Yes, allowed", N = "No, not allowed";
  choiceQuiz(root.querySelector("#mq"), {
    options:[Y, N],
    hint:"Find the subject’s row, then move across to the object’s column. An empty cell (—) means no rights at all.",
    items:[
      {q:"Can <b>Sara</b> read <b>ali_assignment.docx</b>?", a:N, why:"Sara’s cell for that file is empty, so she has no rights."},
      {q:"Can <b>Dr. Noor</b> write to <b>marks.xlsx</b>?", a:Y, why:"Her cell says Read, Write."},
      {q:"Can <b>Ali</b> execute <b>grader.exe</b>?", a:N, why:"Only Dr. Noor has Execute on grader.exe."},
      {q:"Can the <b>Backup process</b> read <b>marks.xlsx</b>?", a:Y, why:"Backups need to read files, so it has Read, but not Write."},
      {q:"An <b>access control list (ACL)</b> stores the matrix…", opts:["One column at a time: a list for each object","One row at a time: a list for each subject","As a single password"], a:"One column at a time: a list for each object",
       why:"ACLs belong to objects (columns). Capability tickets belong to subjects (rows).", hint:"When you tapped a file name, which way did the highlight go?"}
    ],
    onDone: () => { qDone = true; chk(); }
  });
}

function act_refmon(root, api){
  let gameDone = false, propDone = false;
  root.innerHTML = `<p class="small muted">You are the reference monitor. Use this policy (the access matrix) for every request.</p>
    ${matrixHTML(false)}
    <h4 class="part">Part A: decide each request</h4><div id="rg"></div>

function act_unix(root, api){
  const who = ["Owner","Group","Others"], bits = [[0,0,0],[0,0,0],[0,0,0]], vals = [4,2,1], letters = ["r","w","x"];
  const missions = [
    {t:"📝 Make <code>notes.txt</code> private: the owner can read and write; nobody else can do anything.", target:"600", file:"notes.txt"},
    {t:"⚙️ For the script <code>report.sh</code>: the owner can do everything; the group can read and execute; others get nothing.", target:"750", file:"report.sh"},
    {t:"🌐 For the public page <code>index.html</code>: the owner can read and write; the group and everyone else can only read.", target:"644", file:"index.html"}
  ];
  let mi = 0;
  root.innerHTML = `<div class="mission" id="ms"></div>
    <div class="perm">
      <span></span>${["Read (4)","Write (2)","Execute (1)"].map(h=>`<span class="ph">${h}</span>`).join("")}
      ${who.map((w,i)=>`<span class="rh">${w}</span>${[0,1,2].map(j=>`<button class="pbtn" data-i="${i}" data-j="${j}" aria-pressed="false" aria-label="${w} ${letters[j]}">${letters[j]}</button>`).join("")}`).join("")}
    </div>
    <div class="permout">
      <div class="stat"><div class="k">Symbolic (what <code>ls -l</code> shows)</div><div class="v mono" id="sym"></div></div>
      <div class="stat"><div class="k">Octal</div><div class="v mono" id="oct"></div></div>
      <div class="stat"><div class="k">Command</div><div class="v mono" id="cmd"></div></div>
    </div>
    <div class="tasks">${missions.map((m,k)=>`<div class="task" id="um${k}"><span class="tick">✓</span>Mission ${k+1}: ${m.file} → ${m.target}</div>`).join("")}</div>
    <div id="ufb" aria-live="polite"></div>`;
  const ms = root.querySelector("#ms"), fb = root.querySelector("#ufb");
  function octal(){ return bits.map(r => r.reduce((s,b,j)=>s + (b?vals[j]:0),0)).join(""); }
  function draw(){
    const sym = "-" + bits.map(r => r.map((b,j)=>b?letters[j]:"-").join("")).join("");
    root.querySelector("#sym").textContent = sym;
    root.querySelector("#oct").textContent = octal();
    const f = mi < missions.length ? missions[mi].file : "file";
    root.querySelector("#cmd").textContent = `chmod ${octal()} ${f}`;
    ms.innerHTML = mi < missions.length ? `<b>Mission ${mi+1} of 3:</b> ${missions[mi].t}` : `<b>🎉 All missions complete!</b> You can keep experimenting with the buttons.`;
  }
  root.querySelectorAll(".pbtn").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.i, j = +b.dataset.j; bits[i][j] = bits[i][j] ? 0 : 1; b.setAttribute("aria-pressed", bits[i][j] ? "true" : "false");
    if(mi < missions.length && octal() === missions[mi].target){
      root.querySelector("#um"+mi).classList.add("ok");
      fb.innerHTML = `<div class="feedback good"><b>✓ Mission ${mi+1} complete:</b> <code>chmod ${missions[mi].target} ${missions[mi].file}</code>. Each digit is the sum of r=4, w=2, x=1 for owner, group and others.</div>`;
      mi++;
      if(mi === missions.length) api.complete();
    }
    draw();
  }));
  draw();
}

      <div class="seg" role="group" aria-label="Decision for ${r.who}, ${r.perm}"><button class="keep" data-i="${i}" data-v="keep">✓ Keep</button><button class="rev" data-i="${i}" data-v="rev">✕ Revoke</button></div>

  const seq = root.querySelector("#seq"), nx = root.querySelector("#nx");

  function chk(){ if(simDone && qDone) api.complete(); }
  nx.addEventListener("click", () => {
    const s = script[step]; if(!s) return;
    const m = el(`<div class="msg ${s.cls}"><div class="dir">${s.dir}</div><div class="pay">${s.pay}</div><div class="note">${s.note}</div></div>`);

        ],

      });
    }
  });
  root.querySelector("#rs").addEventListener("click", () => { step = 0; seq.innerHTML = ""; label(); });
  label();

        <h1 style="margin-top:14px">Access Control</h1>
        <p class="lead">After authentication proves who you are, access control decides what you may do: the reference monitor, the four models, and identity and access management.</p>
        <ul class="hero-facts"><li>📚 3 lessons, 15 hands-on activities</li><li>💡 Free hints at every step</li><li>📝 Final quiz worth 15 marks</li><li>⏱️ About 45 to 60 minutes</li></ul>
      </div>
      <div class="gate" aria-hidden="true">
        <div class="gate-h">🛡️ Reference monitor: today’s decisions</div>
        <div class="ticket"><div><div class="who">Dr. Noor</div><div class="what">write → marks.xlsx</div></div><span class="stamp allow">ALLOW</span></div>
        <div class="ticket"><div><div class="who">Ali (student)</div><div class="what">write → marks.xlsx</div></div><span class="stamp deny">DENY</span></div>
        <div class="ticket"><div><div class="who">Backup process</div><div class="what">read → notes.pdf</div></div><span class="stamp allow">ALLOW</span></div>
        <div class="ticket"><div><div class="who">Guest visitor</div><div class="what">read → exam_paper.pdf</div></div><span class="stamp deny">DENY</span></div>
      </div>
    </div></div>
    <div class="card" id="who"></div>
  </section>`;
  const who = document.getElementById("who");
  if(has){
    who.innerHTML = `<h3>Welcome back, ${esc(S.name)}!</h3>
      <p>Roll no. <b>${esc(S.roll)}</b>. You’ve completed <b>${doneCount()} of ${TOTAL}</b> activities${S.results.length ? ` and taken the quiz ${S.results.length} time${S.results.length>1?"s":""}` : ""}.</p>
      <div class="row wrap"><button class="btn" id="cont">Continue where I left off</button><button class="btn btn-ghost" id="newst">I’m a different student</button></div>`;
    document.getElementById("cont").addEventListener("click", () => go(screenOverview));
    document.getElementById("newst").addEventListener("click", () => { S = fresh(); save(); go(screenWelcome); });
  } else {
    who.innerHTML = `<h3>Before you begin</h3><p class="muted">Your name and roll number will appear on your result card at the end.</p>
      <div class="who-grid">
        <div class="field"><label for="nm">Full name</label><input class="input" id="nm" maxlength="60" autocomplete="name" placeholder="e.g. Hiba Imran"></div>
        <div class="field"><label for="rl">Roll number</label><input class="input" id="rl" maxlength="30" autocomplete="off" placeholder="e.g. 23CS045"></div>
        <button class="btn" id="startBtn">Start the activity</button>
      </div><div class="err" id="err" aria-live="polite"></div>`;
    const nm = document.getElementById("nm"), rl = document.getElementById("rl"), err = document.getElementById("err");
    function start(){
      const n = nm.value.trim().replace(/\s+/g," "), r = rl.value.trim();
      if(n.length < 2){ err.textContent = "Enter your full name (at least 2 letters)."; nm.focus(); return; }
      if(r.length < 2){ err.textContent = "Enter your roll number."; rl.focus(); return; }
      if(!/^[A-Za-z0-9\-\/_. ]+$/.test(r)){ err.textContent = "Roll numbers can use letters, numbers, dashes, slashes and dots only."; rl.focus(); return; }
      S = fresh(); S.name = n; S.roll = r; save(); go(screenOverview);
    }
    document.getElementById("startBtn").addEventListener("click", start);
    [nm, rl].forEach(x => x.addEventListener("keydown", e => { if(e.key === "Enter") start(); }));
    nm.focus();
  }
}

function modInfo(m){
  const cnt = [0,1,2,3,4].filter(i => S.done[m*5+i]).length;
  const unlocked = m === 0 || S.maxPos >= m*5 - 1;
  const started = S.maxPos >= m*5;
  let target = m*5; for(let i=0;i<5;i++){ if(!S.done[m*5+i]){ target = m*5+i; break; } }
  if(target > S.maxPos + 1) target = Math.max(m*5, Math.min(S.maxPos, m*5+4));
  return {cnt, unlocked, started, target};
}

function screenOverview(){
  mode = "map";
  const first = S.name.split(" ")[0], quizOpen = S.maxPos >= 14, res = S.results;
  const best = res.length ? Math.max(...res.map(r=>r.score)) : null;
  app.innerHTML = `<section class="screen stack">
    <div class="card">
      <span class="tag">👋 Hello, ${esc(first)}</span>
      <h2 style="margin-top:12px">What this activity is about</h2>
      <p>Logging in is only half the story. Once the university portal knows you are Hiba, it still has to decide: may Hiba see her own marks? Edit them? See everyone else’s? That second decision is <b>access control</b>, and it happens thousands of times a second inside every computer you use.</p>
      <p>In this activity you’ll act as the <b>reference monitor</b>, set real UNIX permissions, apply military secrecy rules, design roles for a university, run an access review like an IT administrator, and follow a federated login step by step. Every button gives instant feedback, and hints are always free.</p>
    </div>
    <div class="card">
      <h3>By the end, you will be able to:</h3>
      <ol class="objectives">
        <li>Explain how access control differs from authentication, and where auditing fits.</li>
        <li>Identify subjects, objects and access rights, and read an access matrix, ACL and capability list.</li>
        <li>Act as a reference monitor and explain its three properties.</li>
        <li>Apply least privilege, separation of duties and fail-safe defaults.</li>
        <li>Compare DAC, MAC, RBAC and ABAC, and pick the right model for a scenario.</li>
        <li>Set UNIX file permissions in symbolic and octal form.</li>
        <li>Apply the Bell–LaPadula rules: no read up, no write down.</li>
        <li>Describe the four parts of ICAM and the joiner–mover–leaver lifecycle.</li>
        <li>Spot privilege creep in an access review, and explain identity federation and single sign-on.</li>
      </ol>
    </div>
    <div class="card"><h3>Your learning path</h3><p class="muted small">Lessons unlock one after another. You can return to any finished lesson.</p><div class="journey" id="journey"></div></div>
    <div class="card">
      <h3>How you’ll be marked</h3>
      <div class="tablewrap"><table class="marks">
        <thead><tr><th>Part</th><th>What it is</th><th>Marks</th></tr></thead>
        <tbody>
          <tr><td>Activities</td><td>15 hands-on activities across 3 lessons</td><td>Not graded; your completion count appears on your result card</td></tr>
          <tr><td>Final quiz</td><td>15 multiple-choice questions, 1 mark each</td><td><b>15 marks</b></td></tr>
          <tr><td>Pass mark</td><td>9 out of 15 (60%)</td><td>–</td></tr>
          <tr><td>Grades</td><td>13–15 Excellent (A), 11–12 Very good (B), 9–10 Pass (C), 0–8 Needs revision</td><td>–</td></tr>
        </tbody></table></div>
      <p class="small muted" style="margin-top:10px">The quiz unlocks when you reach the end of Lesson 3. Questions appear in a random order, there are no hints, and each answer is locked once you submit it. Every attempt is numbered on your result card.</p>
    </div>
    <div class="card">
      <h3>How each step works</h3>
      <div class="howto">
        <div><span class="ic">📖</span><b>Learn</b><br><span class="small">Read a short explanation with a campus example.</span></div>
        <div><span class="ic">🎯</span><b>Try it</b><br><span class="small">Do the activity: click, sort, toggle or decide.</span></div>
        <div><span class="ic">💡</span><b>Use hints</b><br><span class="small">Stuck? Hints are free and come one at a time.</span></div>
        <div><span class="ic">✅</span><b>Get feedback</b><br><span class="small">Every answer tells you why it’s right or wrong.</span></div>
      </div>
    </div>
  </section>`;
  const j = document.getElementById("journey");
  MODULES.forEach((mod, m) => {
    const info = modInfo(m);
    const label = !info.unlocked ? "🔒 Locked" : info.cnt === 5 ? "Review" : info.started ? "Continue" : "Start";
    const card = el(`<div class="jcard ${info.unlocked?"":"locked"}"><div class="jnum">${m+1}</div>
      <div><div class="jtitle">${mod.icon} ${mod.title}</div><div class="small muted">${mod.blurb}</div>
        <div class="jmeta"><span class="pill">5 activities</span><span class="pill">About 12 minutes</span><span class="pill">${info.cnt} of 5 done</span></div>
        <div class="progress"><i style="width:${info.cnt*20}%"></i></div>
        ${info.unlocked ? "" : `<div class="small muted" style="margin-top:6px">Reach the end of Lesson ${m} to unlock.</div>`}</div>
      <button class="btn ${info.cnt===5?"btn-ghost":""} btn-sm" ${info.unlocked?"":"disabled"}>${label}</button></div>`);
    card.querySelector("button").addEventListener("click", () => go(screenStep, info.target));
    j.appendChild(card);
  });
  const qc = el(`<div class="jcard quiz ${quizOpen?"":"locked"}"><div class="jnum">📝</div>
    <div><div class="jtitle">Final quiz</div><div class="small muted">15 questions covering all three lessons, 1 mark each.</div>
      <div class="jmeta"><span class="pill">15 marks</span><span class="pill">Pass: 9</span>${res.length ? `<span class="pill">First attempt: ${res[0].score}/15</span><span class="pill">Best: ${best}/15</span>` : ""}</div>
      ${quizOpen ? "" : `<div class="small muted">Reach the end of Lesson 3 to unlock.</div>`}</div>
    <button class="btn btn-sm" ${quizOpen?"":"disabled"}>${quizOpen ? (res.length ? "Retake quiz" : "Take the quiz") : "🔒 Locked"}</button></div>`);
  qc.querySelector("button").addEventListener("click", () => go(screenQuizIntro));
  j.appendChild(qc);
}

function screenStep(pos){
  mode = "step";
  const m = Math.floor(pos/5), s = pos % 5, mod = MODULES[m], st = mod.steps[s];
  if(pos > S.maxPos){ S.maxPos = pos; save(); }
  const done = !!S.done[pos];
  const nextLabel = d => d ? (s < 4 ? "Continue" : "Finish lesson") : "Skip for now";
  app.innerHTML = `<section class="screen stack">
    <div class="card">
      <div class="crumbs"><span class="pill">${mod.icon} Lesson ${m+1}</span><span>${mod.title}</span></div>
      <div class="step-title"><h2>${st.title}</h2><span class="muted">Step ${s+1} of 5</span></div>
      <div class="progress"><i style="width:${(s+1)/5*100}%"></i></div>
    </div>
    <div class="card"><div class="sec-tag">📖 Learn</div>${st.concept}<div class="key">🔑 <b>Key idea:</b> ${st.key}</div></div>
    <div class="card activity ${done?"is-done":""}" id="act">
      <div class="act-head"><div class="sec-tag">🎯 Activity</div><span class="done-badge">✓ Completed</span></div>
      <p class="task-text">${st.task}</p>
      <div id="actBody"></div>
      <div class="hint-area"><button class="btn btn-sm hint-btn" id="hintBtn">💡 Show a hint</button><div id="hints"></div></div>
    </div>
    <div class="card stepnav">
      <button class="btn btn-ghost" id="back">◀ Back</button>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <button class="btn ${done?"":"btn-skip"}" id="next">${nextLabel(done)} ▶</button>
    </div>
  </section>`;
  const act = document.getElementById("act"), nextBtn = document.getElementById("next");
  function drawDots(){ document.getElementById("dots").innerHTML = [0,1,2,3,4].map(i => `<i class="${i===s?"on":""} ${S.done[m*5+i]?"ok":""}"></i>`).join(""); }
  drawDots();
  const api = { complete(){
    if(!S.done[pos]){ S.done[pos] = true; save(); }
    act.classList.add("is-done"); nextBtn.classList.remove("btn-skip"); nextBtn.innerHTML = nextLabel(true) + " ▶";
    drawDots(); renderTop();
  }};
  let hi = 0; const hb = document.getElementById("hintBtn"), hbox = document.getElementById("hints");
  hb.addEventListener("click", () => {
    if(hi >= st.hints.length) return;
    hbox.appendChild(el(`<div class="hintbox"><b>Hint ${hi+1} of ${st.hints.length}:</b> ${st.hints[hi]}</div>`)); hi++;
    if(hi >= st.hints.length){ hb.disabled = true; hb.textContent = "No more hints"; } else hb.textContent = "💡 Show another hint";
  });
  try{ st.activity(document.getElementById("actBody"), api); }catch(e){ console.error(e); }
  document.getElementById("back").addEventListener("click", () => go(s > 0 ? () => screenStep(pos-1) : screenOverview));
  nextBtn.addEventListener("click", () => go(s < 4 ? () => screenStep(pos+1) : () => screenModuleDone(m)));
}

function screenModuleDone(m){
  mode = "done";
  const mod = MODULES[m], cnt = [0,1,2,3,4].filter(i => S.done[m*5+i]).length;
  app.innerHTML = `<section class="screen card done-card">
    <div class="medal">${cnt === 5 ? "🏅" : "🎓"}</div>
    <h2 style="margin-top:10px">Lesson ${m+1} complete!</h2>
    <p class="lead">${mod.title}</p>
    <span class="pill">${cnt} of 5 activities completed</span>
    <div class="takeaways"><h3>What you learned</h3><ul>${mod.takeaways.map(t=>`<li>${t}</li>`).join("")}</ul></div>
    ${cnt < 5 ? `<p class="muted">You skipped ${5-cnt} ${5-cnt===1?"activity":"activities"}. You can go back to them any time from the map.</p>` : ""}
    <div class="row wrap center"><button class="btn btn-ghost" id="toMap">🗺️ Back to map</button><button class="btn" id="nextMod">${m < 2 ? `Start Lesson ${m+2}` : "Go to the final quiz"} ▶</button></div>
  </section>`;
  if(cnt === 5) confetti();
  document.getElementById("toMap").addEventListener("click", () => go(screenOverview));
  document.getElementById("nextMod").addEventListener("click", () => go(m < 2 ? () => screenStep((m+1)*5) : screenQuizIntro));
}

let Q = null;
function screenQuizIntro(){
  mode = "map";
  const n = doneCount();
  app.innerHTML = `<section class="screen card">
    <span class="tag">📝 Final quiz</span>
    <h2 style="margin-top:12px">Ready to test yourself, ${esc(S.name.split(" ")[0])}?</h2>
    <div class="tablewrap" style="margin:14px 0"><table class="marks"><tbody>
      <tr><th>Questions</th><td>15 multiple-choice questions from all three lessons</td></tr>
      <tr><th>Marks</th><td>1 mark per correct answer, <b>15 marks</b> in total</td></tr>
      <tr><th>Pass mark</th><td>9 out of 15 (60%)</td></tr>
      <tr><th>Rules</th><td>No hints. Questions are shuffled. Once you submit an answer it is locked, and you’ll see the explanation straight away.</td></tr>
      <tr><th>This attempt</th><td>Attempt number ${S.results.length + 1}${S.results.length ? `. Your first attempt scored ${S.results[0].score}/15` : ""}</td></tr>
    </tbody></table></div>
    ${n < TOTAL ? `<div class="feedback">You’ve completed ${n} of ${TOTAL} activities. You can still take the quiz, but finishing the activities first will help.</div>` : `<div class="feedback good">You completed all 15 activities. Great preparation!</div>`}
    <div class="row wrap" style="margin-top:16px"><button class="btn btn-ghost" id="qback">🗺️ Back to map</button><button class="btn" id="qgo">Start the quiz ▶</button></div>
  </section>`;
  document.getElementById("qback").addEventListener("click", () => go(screenOverview));
  document.getElementById("qgo").addEventListener("click", () => { Q = { qs: shuffle(QUIZ).map(q => Object.assign({}, q, {order: shuffle([0,1,2,3])})), i:0, score:0, answers:[], start:Date.now() }; go(screenQuestion); });
}

function screenQuestion(){
  mode = "quiz";
  const q = Q.qs[Q.i]; let sel = null, locked = false;
  app.innerHTML = `<section class="screen card">
    <div class="row between wrap"><span class="pill">Question ${Q.i+1} of ${Q.qs.length}</span><span class="pill">Score so far: ${Q.score}</span></div>
    <div class="progress" style="margin-top:12px"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
    <p class="small muted" style="margin:14px 0 0">${q.topic}</p>
    <h3 class="qprompt">${q.q}</h3>
    <div class="qopts">${q.order.map((oi,k) => `<button class="qopt" data-oi="${oi}"><span class="letter">${"ABCD"[k]}</span><span>${q.o[oi]}</span></button>`).join("")}</div>
    <div id="qfb" aria-live="polite"></div>
    <div class="row end" style="margin-top:16px"><button class="btn" id="qsub" disabled>Submit answer</button></div>
  </section>`;
  const sub = document.getElementById("qsub"), btns = app.querySelectorAll(".qopt");
  btns.forEach(b => b.addEventListener("click", () => { if(locked) return; btns.forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.oi; sub.disabled = false; }));
  sub.addEventListener("click", () => {
    if(!locked){
      if(sel === null) return;
      locked = true; const ok = sel === q.a; if(ok) Q.score++;
      Q.answers.push({q:q.q, chosen:q.o[sel], correct:q.o[q.a], ok, ex:q.ex});
      btns.forEach(x => { x.disabled = true; const oi = +x.dataset.oi; if(oi === q.a) x.classList.add("right"); else if(oi === sel) x.classList.add("wrong"); x.classList.remove("sel"); });
      document.getElementById("qfb").innerHTML = `<div class="feedback ${ok?"good":"bad"}"><b>${ok ? "✅ Correct! +1 mark." : "❌ Not this time."}</b> ${q.ex}</div>`;
      sub.textContent = Q.i + 1 < Q.qs.length ? "Next question ▶" : "See my result 🎉";
    } else if(Q.i + 1 < Q.qs.length){ Q.i++; go(screenQuestion); }
    else finishQuiz();
  });
}

function finishQuiz(){
  const r = { score:Q.score, total:15, pct:Math.round(Q.score/15*100), ms:Date.now()-Q.start, date:new Date().toISOString(), attempt:S.results.length+1, activities:doneCount() };
  S.results.push(r); save(); go(screenResult, r, Q.answers);
}

function screenResult(r, answers){
  mode = "result";
  const g = gradeOf(r.score), pass = r.score >= 9;
  const mins = Math.floor(r.ms/60000), secs = Math.round((r.ms%60000)/1000), when = new Date(r.date).toLocaleString();
  const text = `Access Control – Activity Result
Name: ${S.name}
Roll no.: ${S.roll}
Quiz score: ${r.score}/15 (${r.pct}%)
Grade: ${g.g} (${g.t}) – ${pass ? "PASS" : "Needs revision"}
Activities completed: ${r.activities}/15
Attempt: ${r.attempt}
Time taken: ${mins} min ${secs} s
Date: ${when}`;
  app.innerHTML = `<section class="screen stack">
    <div class="card cert">
      <div class="row between wrap"><span class="tag">🏆 Result card</span><span class="pill">Attempt ${r.attempt}</span></div>
      <h2 style="margin-top:12px">Access Control: activity result</h2>
      <div class="result-grid">
        <div class="ring" style="--p:${r.pct}"><div><div><b>${r.score}</b><span>out of 15</span></div></div></div>
        <div class="kv">
          <div><small>Student</small><b>${esc(S.name)}</b></div>
          <div><small>Roll no.</small><b>${esc(S.roll)}</b></div>
          <div><small>Percentage</small><b>${r.pct}%</b></div>
          <div><small>Grade</small><b>${g.g} (${g.t})</b></div>
          <div><small>Status</small><b class="${pass?"status-pass":"status-fail"}">${pass ? "✅ Pass" : "📚 Needs revision"}</b></div>
          <div><small>Activities completed</small><b>${r.activities} of 15</b></div>
          <div><small>Time taken</small><b>${mins} min ${secs} s</b></div>
          <div><small>Date and time</small><b>${esc(when)}</b></div>
        </div>
      </div>
      <p class="small muted" style="margin-top:14px">📸 If your teacher asks for proof, take a screenshot of this card or copy the result text.</p>
      <div class="row wrap"><button class="btn" id="copy">📋 Copy result text</button><button class="btn btn-ghost" id="retake">🔁 Retake quiz</button><button class="btn btn-ghost" id="rmap">🗺️ Back to map</button></div>
      <div id="copyArea"></div>
    </div>
    <div class="card"><h3>Review your answers</h3>
      <ol class="review">${answers.map(a => `<li><b>${a.q}</b><br><span class="${a.ok?"yes":"no"}">${a.ok ? "✓" : "✗"} Your answer: ${a.chosen}</span>${a.ok ? "" : `<br><span class="yes">✓ Correct answer: ${a.correct}</span>`}<div class="small muted" style="margin-top:4px">${a.ex}</div></li>`).join("")}</ol>
    </div>
  </section>`;
  if(pass) confetti();
  const copyBtn = document.getElementById("copy");
  copyBtn.addEventListener("click", () => {
    const fallback = () => {
      const ca = document.getElementById("copyArea");
      ca.innerHTML = `<p class="small muted" style="margin-top:12px">Copying isn’t allowed here, so select the text below and copy it yourself.</p><textarea class="copybox" readonly></textarea>`;
      const ta = ca.querySelector("textarea"); ta.value = text; ta.focus(); ta.select();
    };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { copyBtn.textContent = "✓ Copied"; setTimeout(() => copyBtn.textContent = "📋 Copy result text", 2000); }).catch(fallback);
      else fallback();
    }catch(e){ fallback(); }
  });
  document.getElementById("retake").addEventListener("click", () => go(screenQuizIntro));
  document.getElementById("rmap").addEventListener("click", () => go(screenOverview));
}

load();
go(screenWelcome);
})();
</script>
</body>
</html>
